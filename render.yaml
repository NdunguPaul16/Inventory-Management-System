services:
  - type: web
    name: inventory-management-staging-backend
    runtime: node
    branch: staging/security-audit
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build -w backend
    startCommand: npm run start:staging -w backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ims_staging
      - key: STAGING_ATLAS_HOST
        sync: false
      - key: PRODUCTION_ATLAS_HOST
        sync: false
      - key: STAGING_KEY_VALUE_HOST
        sync: false
      - key: AUTH_ACCESS_TOKEN_SECRET
        sync: false
      - key: AUTH_REFRESH_TOKEN_SECRET
        sync: false
      - key: AUTH_RATE_LIMIT_REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
